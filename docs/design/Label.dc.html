<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach review — forehand clear</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D1210}
a{color:#3DD68C}a:hover{color:#7BE6B0}
</style>
</helmet>
<div style="min-height: 100vh; background: #0D1210; color: #E8EEEA; font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.5">

<header style="border-bottom: 1px solid #27332D">
<div style="max-width: 1360px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px">Badminton Lab · Coach review</span>
<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
<div style="width: 200px; height: 10px; border-radius: 999px; background: #27332D"><div style="width: 35%; height: 100%; border-radius: 999px; background: {{accent}}"></div></div>
<span style="font-weight: 600">Clip 8 of 20</span>
</div>
</div>
</header>

<main style="max-width: 1360px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700">Forehand clear</h1>
<span style="color: #9BA9A2; font-size: 15px">Player C · right-handed · side view</span>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<section aria-label="Video with angles" style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div role="tablist" aria-label="Jump to a moment" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" role="tab" aria-selected="false" style="font: inherit; font-weight: 600; min-height: 52px; color: #E8EEEA; background: #151C19; border: 2px solid #27332D; border-radius: 14px; cursor: pointer">Getting ready</button>
<button type="button" role="tab" aria-selected="true" style="font: inherit; font-weight: 700; min-height: 52px; color: #0D1210; background: {{accent}}; border: none; border-radius: 14px; cursor: pointer">The hit</button>
<button type="button" role="tab" aria-selected="false" style="font: inherit; font-weight: 600; min-height: 52px; color: #E8EEEA; background: #151C19; border: 2px solid #27332D; border-radius: 14px; cursor: pointer">After the hit</button>
</div>

<div style="background: #151C19; border: 1px solid #27332D; border-radius: 22px; overflow: hidden">
<div style="position: relative; background: #0A0E0C; display: flex; justify-content: center">
<svg width="100%" viewBox="0 0 360 560" style="max-width: 420px; display: block" role="img" aria-label="Video frame at the hit with angles drawn on the body: elbow 126 degrees highlighted, knee 158 degrees, shoulder line">
<rect width="360" height="560" fill="#141A17"></rect>
<path d="M0 470 L360 470" stroke="#26302B" stroke-width="2"></path>
<path d="M40 470 L120 400 M320 470 L240 400" stroke="#26302B" stroke-width="2"></path>
<g stroke="#9BA9A2" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
<path d="M190 255 L182 340 L170 400 L150 462"></path>
<path d="M182 340 L210 398 L232 460"></path>
<path d="M160 190 L132 240 L110 290"></path>
<path d="M160 190 L220 195"></path>
<path d="M160 190 L182 340"></path><path d="M220 195 L200 340"></path>
</g>
<circle cx="190" cy="155" r="18" fill="none" stroke="#9BA9A2" stroke-width="4"></circle>
<path d="M150 182 L232 202" stroke="#4CC9F0" stroke-width="2" stroke-dasharray="6 5"></path>
<rect x="234" y="190" width="74" height="26" rx="13" fill="#0D1210" stroke="#4CC9F0"></rect>
<text x="271" y="208" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#4CC9F0">Shoulders</text>
<g stroke="{{accent}}" stroke-width="6" stroke-linecap="round" fill="none">
<path d="M220 195 L246 120"></path>
<path d="M246 120 L222 52"></path>
</g>
<path d="M222 52 L230 18" stroke="#F2B84B" stroke-width="3" stroke-linecap="round"></path>
<path d="M240 137 A18 18 0 0 0 240 104" fill="none" stroke="{{accent}}" stroke-width="3"></path>
<circle cx="246" cy="120" r="7" fill="#0D1210" stroke="{{accent}}" stroke-width="3"></circle>
<rect x="258" y="104" width="70" height="32" rx="16" fill="{{accent}}"></rect>
<text x="293" y="125" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="17" font-weight="700" fill="#0D1210">126°</text>
<path d="M190 386 A16 16 0 0 1 200 374" fill="none" stroke="#C9D3CE" stroke-width="2.5"></path>
<rect x="208" y="368" width="58" height="26" rx="13" fill="#0D1210" stroke="#33403A"></rect>
<text x="237" y="386" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#C9D3CE">158°</text>
<rect x="12" y="12" width="150" height="30" rx="8" fill="rgba(13,18,16,0.85)"></rect>
<text x="22" y="32" font-family="Inter, sans-serif" font-size="14" fill="#E8EEEA">Frame 48 · 0:01.60</text>
</svg>
</div>
<div style="padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: #C9D3CE">
<label style="display: flex; align-items: center; gap: 8px; cursor: pointer"><input type="checkbox" checked style="accent-color: #3DD68C; width: 20px; height: 20px">Show angles</label>
<label style="display: flex; align-items: center; gap: 8px; cursor: pointer"><input type="checkbox" checked style="accent-color: #3DD68C; width: 20px; height: 20px">Show skeleton</label>
</div>
<input type="range" min="0" max="120" value="48" aria-label="Move through the clip" style="accent-color: #3DD68C; width: 100%; height: 30px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" style="font: inherit; font-weight: 600; min-height: 52px; color: #E8EEEA; background: #1B2420; border: 2px solid #33403A; border-radius: 14px; cursor: pointer">◀ Back</button>
<button type="button" style="font: inherit; font-weight: 600; min-height: 52px; color: #0D1210; background: #E8EEEA; border: none; border-radius: 14px; cursor: pointer">▶ Slow</button>
<button type="button" style="font: inherit; font-weight: 600; min-height: 52px; color: #E8EEEA; background: #1B2420; border: 2px solid #33403A; border-radius: 14px; cursor: pointer">Forward ▶</button>
</div>
<button type="button" style="font: inherit; font-weight: 700; min-height: 56px; color: #0D1210; background: {{accent}}; border: none; border-radius: 14px; cursor: pointer">The real hit is at this frame</button>
</div>
</div>
</section>

<form aria-label="Clear checklist" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: {{g.titleColor}}">{{g.title}}</h2>
<button type="button" style="font: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; color: #E8EEEA; background: #151C19; border: 1px solid #33403A; border-radius: 999px; cursor: pointer">Show this moment</button>
</div>
<sc-for list="{{g.items}}" as="q" hint-placeholder-count="3">
<fieldset style="margin: 0; background: #151C19; border: {{q.border}}; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden">{{q.title}}</legend>
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-weight: 700; font-size: 17px">{{q.title}}</span>
<span style="font-size: 14px; color: #9BA9A2">{{q.hint}}</span>
</div>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; white-space: nowrap; color: {{q.valueColor}}">{{q.value}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<label style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; border-radius: 12px; border: 2px solid #33403A; background: #1B2420; font-size: 15px; font-weight: 600; cursor: pointer"><input type="radio" name="{{q.id}}" style="accent-color: #3DD68C; width: 18px; height: 18px">Good</label>
<label style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; border-radius: 12px; border: 2px solid #33403A; background: #1B2420; font-size: 15px; font-weight: 600; cursor: pointer"><input type="radio" name="{{q.id}}" style="accent-color: #F2B84B; width: 18px; height: 18px">Needs work</label>
<label style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; border-radius: 12px; border: 2px solid #33403A; background: #1B2420; font-size: 15px; font-weight: 600; cursor: pointer"><input type="radio" name="{{q.id}}" style="accent-color: #9BA9A2; width: 18px; height: 18px">{{q.third}}</label>
</div>
<input type="text" placeholder="Comment (optional)" aria-label="Comment" style="font: inherit; font-size: 15px; color: #E8EEEA; background: #1B2420; border: 1px solid #27332D; border-radius: 10px; padding: 10px 12px">
</fieldset>
</sc-for>
</section>
</sc-for>
</form>
</div>

<section aria-label="General feedback" style="background: #151C19; border: 1px solid #27332D; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Overall</h2>
<fieldset style="margin: 0; border: none; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-weight: 600">How good was this clear?</legend>
<label style="display: flex; justify-content: center; align-items: center; min-height: 54px; border-radius: 12px; border: 2px solid #33403A; background: #1B2420; cursor: pointer"><input type="radio" name="overall" style="position: absolute; opacity: 0">Poor</label>
<label style="display: flex; justify-content: center; align-items: center; min-height: 54px; border-radius: 12px; border: 2px solid #33403A; background: #1B2420; cursor: pointer"><input type="radio" name="overall" style="position: absolute; opacity: 0">Weak</label>
<label style="display: flex; justify-content: center; align-items: center; min-height: 54px; border-radius: 12px; border: 3px solid {{accent}}; background: rgba(61,214,140,0.1); font-weight: 700; cursor: pointer"><input type="radio" name="overall" checked style="position: absolute; opacity: 0">OK</label>
<label style="display: flex; justify-content: center; align-items: center; min-height: 54px; border-radius: 12px; border: 2px solid #33403A; background: #1B2420; cursor: pointer"><input type="radio" name="overall" style="position: absolute; opacity: 0">Good</label>
<label style="display: flex; justify-content: center; align-items: center; min-height: 54px; border-radius: 12px; border: 2px solid #33403A; background: #1B2420; cursor: pointer"><input type="radio" name="overall" style="position: absolute; opacity: 0">Excellent</label>
</fieldset>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<label style="display: flex; flex-direction: column; gap: 8px; font-weight: 600">Most important thing to fix
<select style="font: inherit; font-weight: 400; color: #E8EEEA; background: #1B2420; border: 1px solid #27332D; border-radius: 12px; padding: 12px"><option>Arm straight at the hit</option><option>Hitting high</option><option>Side-on when ready</option><option>Something not listed</option></select></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-weight: 600">What would you tell this player?
<textarea rows="3" style="font: inherit; font-weight: 400; color: #E8EEEA; background: #1B2420; border: 1px solid #27332D; border-radius: 12px; padding: 12px; resize: vertical">Turn side-on earlier and reach up to hit at full stretch.</textarea></label>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-weight: 600">General comment (anything else, including about the video or the measurements)
<textarea rows="3" placeholder="E.g. camera is behind the player, not side-on; the angles look off" style="font: inherit; font-weight: 400; color: #E8EEEA; background: #1B2420; border: 1px solid #27332D; border-radius: 12px; padding: 12px; resize: vertical"></textarea></label>
<button type="submit" style="font: inherit; font-weight: 700; font-size: 19px; min-height: 64px; color: #0D1210; background: {{accent}}; border: none; border-radius: 18px; cursor: pointer">Save and next clip →</button>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3DD68C","options":["#3DD68C","#4CC9F0","#F2B84B"]},"$preview":{"width":1440,"height":2200}}'>
class Component extends DCLogic {
renderVals() {
const measured = (v) => ({ value: v, valueColor: '#E8EEEA', third: 'Looks wrong' });
const coachOnly = { value: 'You judge', valueColor: '#9BA9A2', third: "Can't see" };
const quiet = '1px solid #27332D';
const active = '2px solid #3DD68C';
return {
accent: this.props.accent ?? '#3DD68C',
groups: [
{ title: '1 · Getting ready', titleColor: '#E8EEEA', items: [
{ id: 'sideon', title: 'Side-on to the net', hint: 'Shoulders turned sideways before the swing', border: quiet, ...coachOnly },
{ id: 'freearm', title: 'Free arm up', hint: 'Non-racket arm raised, pointing at the shuttle', border: quiet, ...coachOnly },
{ id: 'prep', title: 'Racket up early', hint: 'Elbow up and racket ready above the shoulder', border: quiet, ...measured('Yes') },
{ id: 'knee', title: 'Weight on back leg, knees bent', hint: 'Loaded and ready to push', border: quiet, ...measured('152°') }
]},
{ title: '2 · The hit', titleColor: '#7BE6B0', items: [
{ id: 'height', title: 'Hitting high', hint: 'Racket meets the shuttle at full reach', border: active, ...measured('0.62 above') },
{ id: 'elbow', title: 'Arm straight at the hit', hint: 'Elbow angle, 180° = fully straight', border: active, ...measured('126°') },
{ id: 'infront', title: 'Hit slightly in front', hint: 'Contact in front of the head, not behind', border: active, ...coachOnly },
{ id: 'rotate', title: 'Body turns into the hit', hint: 'Hips and shoulders rotate forward', border: active, ...coachOnly }
]},
{ title: '3 · After the hit', titleColor: '#E8EEEA', items: [
{ id: 'follow', title: 'Follow-through across the body', hint: 'Racket finishes on the other side', border: quiet, ...coachOnly },
{ id: 'legs', title: 'Weight moves forward', hint: 'Back leg comes through, ready to recover', border: quiet, ...measured('4°') }
]}
]
};
}
}
</script>
</body>
</html>
